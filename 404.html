<!DOCTYPE html>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --black:#120F2A;--white:#f4f2ee;--yellow:#FFD000;
  --gray:#1E1A3A;--gray-mid:#2e2a50;--text-muted:#8888aa;
  --red:#E8183C;--radius:4px;
}
body{background:var(--black);color:var(--white);font-family:'DM Sans',sans-serif;font-weight:300;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background-image:radial-gradient(ellipse at 80% 10%,rgba(232,24,60,0.08) 0%,transparent 50%),radial-gradient(ellipse at 20% 80%,rgba(42,31,94,0.3) 0%,transparent 60%);}
.card{max-width:520px;width:100%;text-align:center;}
.card img{height:30px;opacity:0.85;margin-bottom:36px;}
.code{font-family:'Bebas Neue',sans-serif;font-size:clamp(90px,20vw,150px);line-height:0.9;color:var(--red);letter-spacing:4px;}
h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(24px,5vw,34px);letter-spacing:2px;margin:10px 0 14px;}
p{color:var(--text-muted);font-size:14.5px;line-height:1.7;max-width:400px;margin:0 auto 32px;}
.links{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;}
.links a{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;text-decoration:none;padding:12px 20px;border-radius:2px;transition:all 0.2s;}
.btn-main{background:var(--yellow);color:var(--black);font-weight:500;}
.btn-main:hover{opacity:0.9;}
.btn-alt{border:1px solid var(--gray-mid);color:var(--text-muted);}
.btn-alt:hover{border-color:var(--red);color:var(--red);}
</style>
</head>
<body>
<div class="card">
  <img src="/logo.png" alt="BoosterStop">
  <div class="code">404</div>
  <h1>Rare pull... but the wrong one.</h1>

  <div class="links">
    <a class="btn-main" href="/">Accueil / Home</a>
    <a class="btn-alt" href="/licences-geneve.html">🃏 Licences</a>
