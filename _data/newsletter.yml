# ============================================================
# NEWSLETTER — une newsletter séparée par pays.
# Gabarit : _layouts/newsletter.html. Pages : newsletter.html (EN),
# fr/, nl/, ar/newsletter.html (front matter seulement).
#
# Chaque pays a SA newsletter : son offre, son code de bienvenue,
# son formulaire et sa liste. Le visiteur choisit UN pays.
#
#   endpoint : formulaire Formspree qui reçoit les inscriptions du pays.
#              Pour séparer complètement les pays, créer un formulaire
#              Formspree par pays et coller son lien ici.
#   liste    : nom de la liste Brevo à alimenter, envoyé avec chaque
#              inscription (champ « liste »).
#   remise   : pourcentage affiché sur la page. Le CODE lui-même n'est
#              jamais écrit sur la page : il part dans l'email de
#              bienvenue de la liste Brevo du pays.
#   statut   : actif | bientot (bientot = inscription « être prévenu de
#              l'ouverture », le code arrive à l'ouverture).
#
# Après l'inscription, un bloc FACULTATIF « Personnalisez votre newsletter »
# demande prénom, distributeur habituel (liste lue dans _data/machines.yml,
# selon le pays) et anniversaire (jour + mois, jamais l'année). Il est envoyé
# au même endpoint avec type: profil et la même adresse email.
#
# Lien direct vers un pays : /newsletter.html#be (ch, be, ae).
# Sans lien direct, la page choisit selon le fuseau horaire du
# visiteur (Zurich → ch, Bruxelles → be, Dubaï → ae), sinon NL → be
# et AR → ae, sinon rien n'est présélectionné.
# ============================================================
pays:
  - id: ch
    drapeau: "🇨🇭"
    statut: actif
    remise: 10
    endpoint: https://formspree.io/f/meebkyng
    liste: newsletter-ch
    fuseaux: [Europe/Zurich]
    nom: { en: Switzerland, fr: Suisse, nl: Zwitserland, ar: سويسرا }
    dans: { en: in Switzerland, fr: en Suisse, nl: in Zwitserland, ar: في سويسرا }
    reseau:
      en: 8 machines in Geneva
      fr: 8 distributeurs à Genève
      nl: 8 automaten in Genève
      ar: 8 آلات في جنيف
    offre:
      en: "Get a <strong>%remise% welcome code</strong> by email, valid in our Swiss machines, plus early access to new drops and promos in Geneva."
      fr: "Recevez par email un <strong>code de bienvenue de %remise%</strong>, valable dans nos distributeurs suisses, plus les nouveautés et les promos à Genève en avant-première."
      nl: "Ontvang per e-mail een <strong>welkomstcode van %remise%</strong>, geldig in onze Zwitserse automaten, plus vroege toegang tot nieuwe releases en promo's in Genève."
      ar: "احصل عبر البريد على <strong>رمز ترحيب بخصم %remise%</strong> صالح في آلاتنا في سويسرا، مع وصول مبكر إلى الإصدارات الجديدة والعروض في جنيف."
    bouton:
      en: "🔔 Subscribe for Switzerland"
      fr: "🔔 Je m'abonne pour la Suisse"
      nl: "🔔 Inschrijven voor Zwitserland"
      ar: "🔔 اشترك في نشرة سويسرا"
    succes:
      en: "✓ You're in. Your %remise% code for our Swiss machines is on its way to your inbox."
      fr: "✓ C'est fait ! Votre code de %remise% pour nos distributeurs suisses arrive dans votre boîte mail."
      nl: "✓ Je bent ingeschreven. Je code van %remise% voor onze Zwitserse automaten komt eraan in je mailbox."
      ar: "✓ تم الاشتراك. رمز خصم %remise% لآلاتنا في سويسرا في طريقه إلى بريدك."

