      fr: "✓ C'est fait ! Votre code de %remise% pour nos distributeurs belges arrive dans votre boîte mail."
      nl: "✓ Je bent ingeschreven. Je code van %remise% voor onze Belgische automaten komt eraan in je mailbox."
