    f_profil: "You are"
    f_profils: ["A vending machine operator", "A trading card shop or distributor", "A retailer, shopping centre or high-footfall venue", "An entrepreneur or investor", "Other"]
    f_message: "Your project"
    f_message_ph: "Your experience, the locations you have in mind, your timeline…"
    f_envoyer: "Send my proposal"
    f_envoi: "Sending…"
    f_ok: "Thank you, your proposal has arrived. We'll get back to you within 48 hours."
    f_err: "Sending failed. Try again or email us at contact@boosterstop.com."
    faq_h2: "Frequently asked questions"
    host: "Host a machine"
    faq:
      - { q: "Which countries are you looking for a partner in?", a: "Germany, Austria, Spain, Italy, Portugal, the Netherlands, Sweden, Norway, Denmark, Finland and the Middle East (Saudi Arabia, Qatar, Kuwait, Bahrain, Oman). Your country isn't listed? Write to us anyway." }
      - { q: "How does the partnership work?", a: "Each country in the network is run by a local company. The model is defined with each partner, based on the country, the number of locations and their profile: we discuss it on the first call." }
      - { q: "What does a machine need?", a: "About 1 m² of floor space (1.1 m² with clearance) and a standard power socket. The machine uses very little power." }
