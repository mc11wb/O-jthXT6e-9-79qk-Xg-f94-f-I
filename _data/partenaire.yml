# Page « Partenaire local » (_layouts/partenaire.html) — un seul gabarit,
# une page par langue : partenaire-local.html, fr/…, nl/…, de/…, es/…, it/…, pt/…, ar/…
#
# Ajouter un pays : une entrée dans « pays » (region = europe | nord | golfe),
# avec son nom dans chaque langue. Il apparaît dans la liste et le formulaire.
# « %n » = nombre de machines en service (calculé depuis _data/machines.yml
# et _data/pays.yml). « %host% » = lien vers la page Accueillir une machine.

regions: [europe, nord, golfe]

