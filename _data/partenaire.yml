textes:
  fr:
    title: "Partenaire local : lancez BoosterStop dans votre pays | BoosterStop"
    description: "BoosterStop cherche des partenaires locaux pour ouvrir son réseau de distributeurs de cartes TCG en Allemagne, Autriche, Espagne, Italie, Portugal, aux Pays-Bas, en Europe du Nord et au Moyen-Orient."
    og_title: "BoosterStop cherche un partenaire local dans votre pays"
    h1: ["Nous cherchons", "un partenaire local", "dans votre pays"]
    lede: "BoosterStop veut s'implanter dans de nouveaux pays. Dans chacun, nous cherchons une entreprise sur place pour installer et exploiter nos distributeurs de cartes TCG."
    cta_form: "Proposer un partenariat"
    cta_pays: "Voir les pays"
    faits: ["%n machines en service en Suisse et en Belgique", "Le stock de chaque machine visible en direct", "Uniquement des produits scellés, achetés aux distributeurs officiels"]
    pays_h2: "Les pays où nous cherchons un partenaire"
    pays_sub: "Choisissez votre pays : il sera déjà sélectionné dans le formulaire."
    region_europe: "Europe"
    region_nord: "Europe du Nord"
    region_golfe: "Moyen-Orient"
    autre: "Un autre pays"
    reseau: "Déjà dans le réseau : la Suisse et la Belgique. Les Émirats arabes unis sont en lancement et la France à l'étude."
    reseau_lien: "Voir le réseau et les villes prévues"
    modele_h2: "Le partenariat"
    modele_sub: "Chaque pays du réseau est exploité par une entreprise locale. Le modèle se construit avec vous, selon le pays, le nombre d'emplacements et votre profil."
    nous_h3: "BoosterStop apporte"
    nous: ["Un concept qui tourne déjà, avec des machines en service en Suisse et en Belgique", "La marque, le site et le stock en direct de chaque machine", "Le savoir-faire terrain : choix des emplacements, sélection des produits, réassort", "Une gamme multilicence : Pokémon, One Piece, Magic et 21 autres licences"]
    vous_h3: "Vous apportez"
    vous: ["Une entreprise implantée dans votre pays", "La connaissance de votre marché et de ses lieux à fort passage", "L'exploitation au quotidien : installation, réassort, entretien", "Le respect de notre règle : des produits scellés, uniquement venus des distributeurs officiels"]
    profils_h2: "Qui nous cherchons"
    profils: ["Exploitants de distributeurs automatiques", "Boutiques et distributeurs de jeux de cartes", "Enseignes, centres commerciaux, gares et aéroports", "Entrepreneurs et investisseurs implantés localement"]
    etapes_h2: "Comment ça se passe"
    etapes:
      - { t: "Vous nous écrivez", d: "Le formulaire prend deux minutes : votre pays, les villes visées et votre profil." }
      - { t: "On fait connaissance", d: "Un appel pour parler de votre marché, des emplacements possibles et du modèle qui vous convient." }
      - { t: "Un premier emplacement", d: "On démarre avec une machine pilote, puis on déploie le réseau dans votre pays." }
    form_h2: "Proposer un partenariat"
    form_sub: "Réponse sous 48 h. Vos informations servent uniquement à vous recontacter."
    f_prenom: "Prénom"
    f_nom: "Nom"
    f_societe: "Entreprise"
    f_facultatif: "facultatif"
    f_pays: "Pays"
    f_choisir: "Choisissez votre pays"
    f_autre: "Autre pays"
    f_villes: "Ville(s) visée(s)"
    f_villes_ph: "Madrid, Barcelone…"
    f_email: "E-mail"
    f_tel: "Téléphone"
    f_profil: "Vous êtes"
    f_profils: ["Exploitant de distributeurs automatiques", "Boutique ou distributeur de jeux de cartes", "Enseigne, centre commercial ou lieu à fort passage", "Entrepreneur ou investisseur", "Autre"]
    f_message: "Votre projet"
    f_message_ph: "Votre expérience, les emplacements que vous visez, votre calendrier…"
    f_envoyer: "Envoyer ma proposition"
    f_envoi: "Envoi…"
    f_ok: "Merci, votre proposition est bien arrivée. Nous revenons vers vous sous 48 h."
    f_err: "L'envoi n'a pas abouti. Réessayez ou écrivez-nous à contact@boosterstop.com."
    faq_h2: "Questions fréquentes"
    host: "Accueillir une machine"
    faq:
      - { q: "Dans quels pays cherchez-vous un partenaire ?", a: "En Allemagne, en Autriche, en Espagne, en Italie, au Portugal, aux Pays-Bas, en Suède, en Norvège, au Danemark, en Finlande et au Moyen-Orient (Arabie saoudite, Qatar, Koweït, Bahreïn, Oman). Votre pays n'est pas dans la liste ? Écrivez-nous quand même." }
      - { q: "Comment fonctionne le partenariat ?", a: "Chaque pays du réseau est exploité par une entreprise locale. Le modèle se définit avec chaque partenaire, selon le pays, le nombre d'emplacements et son profil : nous en parlons dès le premier appel." }
      - { q: "Que faut-il pour installer une machine ?", a: "Environ 1 m² au sol (1,1 m² avec le dégagement) et une prise électrique standard. La machine consomme très peu." }
      - { q: "Je veux seulement accueillir une machine dans mon commerce.", a: "En Suisse et en Belgique, passez par la page %host%. Dans les autres pays, écrivez-nous avec le formulaire ci-dessus en choisissant « Enseigne, centre commercial ou lieu à fort passage »." }
      - { q: "Quels produits sont vendus ?", a: "Des boosters, displays et coffrets scellés de 24 licences, de Pokémon à Riftbound, achetés uniquement aux distributeurs officiels." }
    liens_aria: "Pages utiles"
    liens:
      - { t: "Le réseau et les villes prévues", f: "expansion.html" }
      - { t: "Le stock en direct", f: "stock.html" }
      - { t: "Accueillir une machine", f: "installer-un-distributeur.html" }
      - { t: "Presse", f: "presse.html" }

  en:
    title: "Local partner wanted: bring BoosterStop to your country | BoosterStop"
    description: "BoosterStop is looking for local partners to open its TCG vending machine network in Germany, Austria, Spain, Italy, Portugal, the Netherlands, the Nordics and the Middle East."
    og_title: "BoosterStop is looking for a local partner in your country"
    h1: ["We're looking for", "a local partner", "in your country"]
    lede: "BoosterStop is expanding into new countries. In each one, we're looking for a local company to install and run our TCG vending machines."
    cta_form: "Propose a partnership"
    cta_pays: "See the countries"
    faits: ["%n machines running in Switzerland and Belgium", "Live stock for every machine", "Sealed products only, bought from official distributors"]
    pays_h2: "Countries where we're looking for a partner"
    pays_sub: "Pick your country and it will already be selected in the form."
    region_europe: "Europe"
    region_nord: "Nordics"
    region_golfe: "Middle East"
    autre: "Another country"
    reseau: "Already in the network: Switzerland and Belgium. The United Arab Emirates are launching and France is under study."
    reseau_lien: "See the network and planned cities"
    modele_h2: "The partnership"
    modele_sub: "Each country in the network is run by a local company. We build the model with you, based on the country, the number of locations and your profile."
    nous_h3: "BoosterStop brings"
    nous: ["A concept that already works, with machines running in Switzerland and Belgium", "The brand, the website and live stock for every machine", "Field know-how: choosing locations, selecting products, restocking", "A multi-license range: Pokémon, One Piece, Magic and 21 other licenses"]
    vous_h3: "You bring"
    vous: ["A company based in your country", "Knowledge of your market and its high-footfall locations", "Day-to-day operations: installation, restocking, maintenance", "Our one rule: sealed products only, from official distributors"]
    profils_h2: "Who we're looking for"
    profils: ["Vending machine operators", "Trading card shops and distributors", "Retail chains, shopping centres, stations and airports", "Entrepreneurs and investors with a local presence"]
    etapes_h2: "How it works"
    etapes:
      - { t: "You write to us", d: "The form takes two minutes: your country, target cities and profile." }
      - { t: "We get to know each other", d: "A call about your market, possible locations and the model that suits you." }
      - { t: "A first location", d: "We start with a pilot machine, then roll out the network in your country." }
    form_h2: "Propose a partnership"
    form_sub: "We reply within 48 hours. Your details are only used to get back to you."
    f_prenom: "First name"
    f_nom: "Last name"
    f_societe: "Company"
    f_facultatif: "optional"
    f_pays: "Country"
    f_choisir: "Choose your country"
    f_autre: "Another country"
    f_villes: "Target city or cities"
    f_villes_ph: "Madrid, Barcelona…"
    f_email: "Email"
    f_tel: "Phone"
    f_profil: "You are"
    f_profils: ["A vending machine operator", "A trading card shop or distributor", "A retailer, shopping centre or high-footfall venue", "An entrepreneur or investor", "Other"]
    f_message: "Your project"
    f_message_ph: "Your experience, the locations you have in mind, your timeline…"
    f_envoyer: "Send my proposal"
    f_envoi: "Sending…"
    f_ok: "Thank you, your proposal has arrived. We'll get back to you within 48 hours."
    f_err: "Sending failed. Try again or email us at contact@boosterstop.com."
    faq_h2: "Frequently asked questions"
    host: "Host a machine"
    faq:
      - { q: "Which countries are you looking for a partner in?", a: "Germany, Austria, Spain, Italy, Portugal, the Netherlands, Sweden, Norway, Denmark, Finland and the Middle East (Saudi Arabia, Qatar, Kuwait, Bahrain, Oman). Your country isn't listed? Write to us anyway." }
      - { q: "How does the partnership work?", a: "Each country in the network is run by a local company. The model is defined with each partner, based on the country, the number of locations and their profile: we discuss it on the first call." }
      - { q: "What does a machine need?", a: "About 1 m² of floor space (1.1 m² with clearance) and a standard power socket. The machine uses very little power." }
      - { q: "I only want to host a machine in my venue.", a: "In Switzerland and Belgium, use the %host% page. In other countries, write to us with the form above and choose “A retailer, shopping centre or high-footfall venue”." }
      - { q: "What products are sold?", a: "Sealed boosters, displays and boxes from 24 licenses, from Pokémon to Riftbound, bought only from official distributors." }
    liens_aria: "Useful pages"
    liens:
      - { t: "The network and planned cities", f: "expansion.html" }
      - { t: "Live stock", f: "stock.html" }
      - { t: "Host a machine", f: "installer-un-distributeur.html" }
      - { t: "Press", f: "presse.html" }

