    faq:
      - { q: "في أي بلدان تبحثون عن شريك؟", a: "في ألمانيا والنمسا وإسبانيا وإيطاليا والبرتغال وهولندا والسويد والنرويج والدنمارك وفنلندا والشرق الأوسط (المملكة العربية السعودية وقطر والكويت والبحرين وعُمان). بلدك غير مدرج؟ راسلنا على أي حال." }
      - { q: "كيف تعمل الشراكة؟", a: "تُدار الشبكة في كل بلد من قِبل شركة محلية، ويُحدَّد النموذج مع كل شريك بحسب البلد وعدد المواقع وطبيعة نشاطه، ونناقشه في المكالمة الأولى." }
      - { q: "ماذا تحتاج الآلة؟", a: "نحو 1 م² من المساحة (1.1 م² مع المسافة اللازمة حولها) ومقبس كهرباء عادي، واستهلاكها للكهرباء منخفض جدًا." }
      - { q: "أريد فقط استضافة آلة في متجري.", a: "في سويسرا وبلجيكا، استخدم صفحة %host% (بالإنجليزية). وفي البلدان الأخرى، راسلنا عبر النموذج أعلاه واختر «متجر أو مركز تسوق أو موقع ذو إقبال كبير»." }
      - { q: "ما المنتجات المعروضة؟", a: "أكياس بطاقات (Boosters) وعلب عرض وصناديق مختومة من 24 ترخيصًا، من Pokémon إلى Riftbound، تُشترى من الموزعين الرسميين فقط." }
