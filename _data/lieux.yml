        a: Par un loyer fixe ou une part du chiffre d'affaires de la machine. Nous en convenons ensemble selon le passage.
      - q: Qui gère l'encaissement et les pannes ?
        a: Nous. Le paiement se fait à la machine, rien ne passe par vos guichets. Installation, maintenance et service client sont à notre charge.
      - q: Quelle place et quelle alimentation faut-il ?
        a: Environ 1 m² au sol (1,1 m² avec le dégagement) et une prise électrique standard. La machine pèse 280 kg et consomme très peu.
