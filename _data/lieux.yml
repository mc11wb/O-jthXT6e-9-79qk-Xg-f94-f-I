      why_h2: Waarom het werkt in een station
      why:
      - t: Klanten die elke dag terugkomen
        d: Pendelaars komen 's ochtends en 's avonds door het station. Verzamelaars komen terug bij elke nieuwe set en bekijken de voorraad online voor ze langskomen.
      - t: Een aankoop die in een overstap past
        d: 'Kiezen, betalen, meenemen: het duurt maar even. Genoeg tijd tussen twee treinen, zonder wachtrij en zonder verkoper.'
      - t: Omzet zonder personeel
        d: 'In Genève haalt een automaat gemiddeld meer dan 400 verkopen per maand. Betalen gebeurt aan de automaat: contant met wisselgeld, contactloos met kaart of smartphone, en TWINT in Zwitserland.'
      - t: Leven in de stationshal
        d: Een nieuwe set zit in de automaat op de dag van de release. Op die dagen trekt de automaat volk en geeft hij mensen een reden om langs uw station te komen.
      integ_h2: Hoe de automaat past
      integ:
      - t: In de hal of een winkelgalerij
        d: 'De automaat moet beschut staan: in de hal, een winkelgalerij of een overdekte doorgang, dicht bij de grootste stromen.'
      - t: Een pilot in één station
        d: 'De eenvoudigste start is één automaat in één station: de verkoop meten en dan samen beslissen over het vervolg.'
      - t: Een flexibele vergoeding
        d: Een vaste huur of een deel van de omzet, wat het best bij uw netwerk past. Zonder minimumduur.
      - t: Bijvullen zonder de stromen te hinderen
        d: We komen elke week, en vaker wanneer er een set uitkomt, op momenten die u passen.
      faq:
      - q: Kan de automaat op een perron staan?
        a: Hij moet binnen of beschut tegen het weer staan. Een hal, een winkelgalerij of een overdekte doorgang zijn ideaal.
      - q: Kunnen we met één station beginnen?
        a: 'Ja, dat raden we zelfs aan: één pilotautomaat, gemeten verkoop, en dan een beslissing over de rest van het netwerk.'
      - q: Hoe wordt het station vergoed?
        a: Met een vaste huur of een deel van de omzet van de automaat. We spreken het samen af, op basis van de passage.
      - q: Wie regelt de betalingen en storingen?
        a: Wij. Betalen gebeurt aan de automaat en niets loopt via uw loketten. Installatie, onderhoud en klantenservice zijn voor ons.
      - q: Welke ruimte en stroom zijn nodig?
        a: Ongeveer 1 m² vloeroppervlak (1,1 m² met vrije ruimte) en een gewoon stopcontact. De automaat weegt 280 kg en verbruikt zeer weinig.
  centre-commercial:
    fichier: distributeur-centre-commercial.html
    fr:
      title: Distributeur de cartes TCG pour centres commerciaux | BoosterStop
      description: 'Installez un distributeur de cartes à collectionner dans votre centre commercial : environ 1 m², plus de 10 000 CHF de ventes par mois en moyenne, des visites ciblées à chaque sortie de set.'
      crumb: Centres commerciaux
      h1: Un distributeur de cartes à collectionner dans votre centre commercial
      lead: Une machine d'environ 1 m² qui attire les collectionneurs, les familles et les jeunes adultes. BoosterStop l'installe, la remplit et l'entretient ; vous fournissez l'emplacement.
      why_h2: Pourquoi ça marche dans un centre commercial
      why:
      - t: Des visites qui reviennent
        d: Les collectionneurs repassent à chaque sortie de set. Notre page de stock en direct leur donne une raison de vérifier, puis de venir chez vous plutôt qu'ailleurs.
      - t: Le public que vous cherchez
        d: 'Pokémon et One Piece parlent aux enfants, à leurs parents et aux jeunes adultes qui collectionnent : le cœur de la clientèle d''un centre commercial.'
      - t: Peu de surface, beaucoup de chiffre
        d: À Genève, une machine fait en moyenne plus de 10 000 CHF de ventes par mois sur environ 1 m². Elle trouve sa place dans une allée ou un espace commun, avec un engagement souple et sans durée minimale.
      - t: Des jours de sortie qui font parler
        d: Un nouveau set est en machine le jour de sa sortie. Ces jours-là, la machine crée de l'animation dans le centre.
      integ_h2: Comment la machine s'intègre
      integ:
      - t: Allée, entrée ou espace commun
        d: Un emplacement visible, à l'intérieur, près des flux principaux. Environ 1 m² au sol et une prise électrique suffisent.
      - t: Aucune gestion pour vos équipes
        d: 'Installation, réassort hebdomadaire, maintenance et service client : tout est à notre charge. Le paiement se fait à la machine.'
      - t: Une rémunération au choix
        d: Loyer fixe ou part du chiffre d'affaires, selon votre politique. Engagement souple, sans durée minimale imposée.
      - t: Votre centre en ligne
        d: Chaque machine a sa page sur notre site, avec l'adresse du lieu. À Genève, on y voit aussi son stock en direct.
      faq:
      - q: Où placer la machine dans le centre ?
        a: 'Là où passent le plus de visiteurs : entrée, allée principale, près des escalators ou d''une enseigne de jouets ou de loisirs. Nous en parlons lors du premier échange.'
      - q: Qui encaisse les ventes ?
        a: 'La machine elle-même : espèces avec monnaie rendue, carte sans contact, smartphone, et TWINT en Suisse. Rien ne passe par vos caisses.'
      - q: Comment le centre est-il rémunéré ?
        a: Par un loyer fixe ou une part du chiffre d'affaires de la machine, au choix. Nous en convenons ensemble selon le passage.
      - q: La machine fait-elle concurrence à nos enseignes ?
        a: Nous composons l'assortiment avec vous. Si une enseigne du centre vend déjà certains produits, nous pouvons les laisser de côté.
      - q: Qui est responsable de la machine ?
        a: 'Nous. Elle reste notre propriété et relève de notre assurance : vous n''assumez aucune responsabilité financière.'
