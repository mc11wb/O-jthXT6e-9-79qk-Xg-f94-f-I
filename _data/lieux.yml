      title: Distributeur de cartes TCG pour gares | BoosterStop
      description: 'Un distributeur de cartes à collectionner en libre-service dans votre gare : environ 1 m², plus de 400 ventes par mois en moyenne, installation, réassort et maintenance pris en charge.'
