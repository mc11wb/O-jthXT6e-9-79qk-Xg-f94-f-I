lieux:
  aeroport:
    fichier: distributeur-aeroport.html
    fr:
      title: Distributeur de cartes TCG pour aéroports | BoosterStop
      description: 'Un distributeur de cartes à collectionner en libre-service dans votre aéroport : environ 1 m², plus de 10 000 CHF de ventes par mois en moyenne, installation et réassort pris en charge.'
      crumb: Aéroports
      h1: Un distributeur de cartes à collectionner dans votre aéroport
      lead: 'Pokémon, One Piece, Magic : des boosters scellés en libre-service, sur environ 1 m². BoosterStop installe, remplit et entretient la machine. L''aéroport fournit l''emplacement et perçoit une redevance.'
      why_h2: Pourquoi ça marche dans un aéroport
      why:
      - t: Des passagers qui ont du temps
        d: Entre le contrôle de sécurité et l'embarquement, les passagers attendent. Un booster s'achète en quelques secondes, se glisse dans un bagage cabine et occupe les enfants pendant le vol.
      - t: Un public venu du monde entier
        d: Pokémon, One Piece et Magic se collectionnent sur tous les continents. Nos machines proposent aussi des éditions japonaises et chinoises, recherchées par les collectionneurs et appréciées comme souvenir.
      - t: Beaucoup de chiffre sur peu de place
        d: À Genève, une machine fait en moyenne plus de 10 000 CHF de ventes par mois, sur environ 1 m² au sol. Rapporté au mètre carré, c'est un chiffre qui compte dans une zone commerciale où chaque mètre est loué.
      - t: Aucun personnel, aucune caisse
        d: 'Le paiement se fait à la machine : carte sans contact, smartphone, ou espèces avec monnaie rendue. Rien ne passe par vos équipes.'
      integ_h2: Comment la machine s'intègre
      integ:
      - t: Zone publique ou zone réservée
        d: La machine va là où vous le décidez. Pour nos passages en zone réservée, nous suivons vos procédures d'accès et de sécurité.
      - t: Réassort aux heures creuses
        d: Le réassort a lieu chaque semaine, et plus souvent à la sortie d'un nouveau set, aux créneaux que vous fixez.
      - t: Un format de concession classique
        d: Redevance fixe ou part du chiffre d'affaires, selon vos règles de concession. Engagement souple, sans durée minimale imposée.
      - t: Une image soignée
        d: Uniquement des produits scellés, achetés chez les distributeurs officiels. À Genève, le stock de chaque machine est visible en ligne, en direct.
      faq:
      - q: Quelle surface faut-il ?
        a: Environ 1 m² par machine, 1,1 m² avec le dégagement nécessaire. La machine pèse 280 kg et ne demande qu'une prise électrique standard ; sa consommation est très basse.
      - q: Les voyageurs étrangers peuvent-ils payer ?
        a: Oui. La machine accepte la carte sans contact et le paiement par smartphone, en plus des espèces avec monnaie rendue.
      - q: Comment l'aéroport est-il rémunéré ?
        a: Par une redevance fixe ou par une part du chiffre d'affaires de la machine, selon votre modèle de concession. Nous en convenons ensemble.
      - q: Qui s'occupe des pannes et du service client ?
        a: 'Nous. La machine reste notre propriété et relève de notre assurance : l''aéroport n''assume aucune responsabilité financière à son égard.'
      - q: Peut-on commencer par une seule machine ?
        a: Oui. Une première machine permet de mesurer les ventes réelles sur votre site avant d'aller plus loin.
    en:
      title: TCG vending machines for airports | BoosterStop
      description: 'A self-service trading card vending machine in your airport: about 1 m², over CHF 10,000 in sales per month on average, installation and restocking handled for you.'
      crumb: Airports
      h1: A trading card vending machine in your airport
      lead: 'Pokémon, One Piece, Magic: sealed boosters in self-service, on about 1 m². BoosterStop installs, fills and maintains the machine. The airport provides the space and receives a fee.'
      why_h2: Why it works in an airport
      why:
      - t: Passengers with time on their hands
        d: Between security and boarding, passengers wait. A booster takes seconds to buy, slips into a cabin bag and keeps children busy on the flight.
      - t: A worldwide audience
        d: Pokémon, One Piece and Magic are collected on every continent. Our machines also carry Japanese and Chinese editions, sought after by collectors and popular as souvenirs.
      - t: High sales on little space
        d: In Geneva, a machine averages over CHF 10,000 in sales per month on about 1 m² of floor space. Measured per square metre, that figure matters in a commercial zone where every metre is let.
      - t: No staff, no till
        d: 'Customers pay at the machine: contactless card, smartphone, or cash with change. Nothing goes through your teams.'
      integ_h2: How the machine fits in
      integ:
      - t: Landside or airside
        d: The machine goes where you decide. For our visits airside, we follow your access and security procedures.
      - t: Restocking off-peak
        d: We restock every week, and more often when a new set comes out, in the time slots you set.
      - t: A standard concession format
        d: A fixed fee or a share of revenue, under your concession rules. Flexible commitment, no minimum term.
      - t: A clean brand image
        d: Sealed products only, bought from official distributors. In Geneva, each machine's stock is visible online, live.
      faq:
      - q: How much space is needed?
        a: About 1 m² per machine, 1.1 m² including the clearance needed. The machine weighs 280 kg and only needs a standard socket; its power use is very low.
      - q: Can international travellers pay?
        a: Yes. The machine takes contactless cards and smartphone payments, as well as cash with change.
      - q: How is the airport paid?
        a: Through a fixed fee or a share of the machine's revenue, depending on your concession model. We agree on it together.
      - q: Who handles breakdowns and customer service?
        a: 'We do. The machine remains our property and is covered by our insurance: the airport carries no financial responsibility for it.'
      - q: Can we start with a single machine?
        a: Yes. A first machine lets you measure real sales at your site before going further.
    nl:
      title: TCG-automaten voor luchthavens | BoosterStop
      description: 'Een selfservice-automaat met verzamelkaarten in uw luchthaven: ongeveer 1 m², gemiddeld meer dan 10.000 CHF omzet per maand, installatie en bijvullen door ons.'
      crumb: Luchthavens
      h1: Een automaat met verzamelkaarten in uw luchthaven
      lead: 'Pokémon, One Piece, Magic: verzegelde boosters in selfservice, op ongeveer 1 m². BoosterStop installeert, vult en onderhoudt de automaat. De luchthaven levert de plek en ontvangt een vergoeding.'
      why_h2: Waarom het werkt in een luchthaven
      why:
      - t: Passagiers met tijd
        d: Tussen de veiligheidscontrole en het boarden wachten passagiers. Een booster is in enkele seconden gekocht, past in de handbagage en houdt kinderen bezig tijdens de vlucht.
      - t: Een publiek van over de hele wereld
        d: Pokémon, One Piece en Magic worden op alle continenten verzameld. Onze automaten hebben ook Japanse en Chinese edities, gezocht door verzamelaars en geliefd als souvenir.
      - t: Veel omzet op weinig ruimte
        d: In Genève haalt een automaat gemiddeld meer dan 10.000 CHF omzet per maand op ongeveer 1 m² vloeroppervlak. Per vierkante meter is dat een cijfer dat telt in een commerciële zone waar elke meter verhuurd wordt.
      - t: Geen personeel, geen kassa
        d: 'Klanten betalen aan de automaat: contactloos met kaart of smartphone, of contant met wisselgeld. Niets loopt via uw medewerkers.'
      integ_h2: Hoe de automaat past
      integ:
      - t: Openbare of beveiligde zone
        d: De automaat komt waar u beslist. Voor onze bezoeken aan de beveiligde zone volgen we uw toegangs- en veiligheidsprocedures.
      - t: Bijvullen buiten de piekuren
        d: We vullen elke week bij, en vaker wanneer er een nieuwe set uitkomt, op de momenten die u bepaalt.
      - t: Een klassieke concessievorm
        d: Een vaste vergoeding of een deel van de omzet, volgens uw concessieregels. Flexibele verbintenis, zonder minimumduur.
      - t: Een verzorgd imago
        d: Alleen verzegelde producten, gekocht bij officiële distributeurs. In Genève is de voorraad van elke automaat live online te zien.
      faq:
      - q: Hoeveel ruimte is er nodig?
        a: Ongeveer 1 m² per automaat, 1,1 m² met de nodige vrije ruimte. De automaat weegt 280 kg en heeft alleen een gewoon stopcontact nodig; het verbruik is zeer laag.
      - q: Kunnen buitenlandse reizigers betalen?
        a: Ja. De automaat aanvaardt contactloze kaarten en betalen met de smartphone, naast contant geld met wisselgeld.
      - q: Hoe wordt de luchthaven vergoed?
        a: Met een vaste vergoeding of een deel van de omzet van de automaat, volgens uw concessiemodel. We spreken het samen af.
      - q: Wie regelt storingen en klantenservice?
        a: 'Wij. De automaat blijft ons eigendom en valt onder onze verzekering: de luchthaven draagt er geen enkele financiële verantwoordelijkheid voor.'
      - q: Kunnen we met één automaat beginnen?
        a: Ja. Met een eerste automaat meet u de echte verkoop op uw locatie voor u verder gaat.
