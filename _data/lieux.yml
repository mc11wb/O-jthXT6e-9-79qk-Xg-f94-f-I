      h1: Un distributeur de cartes à collectionner dans votre gare
      lead: Des boosters Pokémon, One Piece ou Magic en libre-service, entre deux trains. BoosterStop installe, remplit et entretient la machine ; la gare fournit l'emplacement et une prise électrique.
      why_h2: Pourquoi ça marche dans une gare
      why:
      - t: Des clients qui repassent chaque jour
        d: Les pendulaires traversent la gare matin et soir. Les collectionneurs reviennent à chaque sortie de set, et consultent le stock en ligne avant de passer.
      - t: Un achat qui tient dans une correspondance
        d: 'Choisir, payer, récupérer : l''achat prend quelques instants. Assez pour le faire entre deux trains, sans file d''attente ni vendeur.'
